<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grey-box Layout Clone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f4f4; color: #333; }
    
    /* CSS Grid Page Shell */
    .page-shell {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 100vh;
      gap: 1.5rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Flexbox Header / Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ccc;
      padding: 1rem 1.5rem;
      border-radius: 6px;
    }
    .logo { background: #999; width: 100px; height: 32px; border-radius: 4px; }
    .nav-links { display: flex; gap: 1rem; }
    .nav-item { background: #bbb; width: 60px; height: 24px; border-radius: 4px; }

    /* Hero Banner */
    .hero {
      background: #ddd;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
      font-weight: bold;
    }

    /* Grid for Cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* Flexbox inside Card */
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .card-img { background: #bbb; height: 140px; border-radius: 4px; }
    .card-title { background: #999; height: 20px; width: 70%; border-radius: 4px; }
    .card-desc { background: #eee; height: 40px; border-radius: 4px; }
    .card-btn { background: #777; height: 32px; width: 100px; border-radius: 4px; margin-top: auto; }

    footer {
      background: #ccc;
      padding: 1.5rem;
      text-align: center;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <div class="logo"></div>
      <div class="nav-links">
        <div class="nav-item"></div>
        <div class="nav-item"></div>
        <div class="nav-item"></div>
      </div>
    </header>

    <section class="hero">Hero Banner Wireframe</section>

    <main class="card-grid">
      <div class="card">
        <div class="card-img"></div>
        <div class="card-title"></div>
        <div class="card-desc"></div>
        <div class="card-btn"></div>
      </div>
      <div class="card">
        <div class="card-img"></div>
        <div class="card-title"></div>
        <div class="card-desc"></div>
        <div class="card-btn"></div>
      </div>
      <div class="card">
        <div class="card-img"></div>
        <div class="card-title"></div>
        <div class="card-desc"></div>
        <div class="card-btn"></div>
      </div>
    </main>

    <footer>Footer Section</footer>
  </div>
</body>
</html>
