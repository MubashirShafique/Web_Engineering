<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            line-height: 1.5;
            background: #f4f4f9;
            color: #333;
            padding: 1rem;
        }

        /* Mobile-First Base (320px safe) */
        header {
            background: #222;
            color: #fff;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        nav a {
            color: #4fc3f7;
            text-decoration: none;
            font-weight: 500;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Profile Card */
        .profile-card {
            background: #fff;
            padding: 1.25rem;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1rem;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: #7c4dff;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Form */
        .contact-form {
            background: #fff;
            padding: 1.25rem;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .contact-form h3 {
            margin-bottom: 0.25rem;
        }

        input, textarea, button {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit;
        }

        button {
            background: #7c4dff;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #777;
        }

        /* Media Queries (Min-Width 640px) */
        @media (min-width: 640px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                text-align: left;
                max-width: 800px;
                margin-left: auto;
                margin-right: auto;
            }

            nav {
                flex-direction: row;
                gap: 1rem;
            }

            .profile-card {
                flex-direction: row;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>My Profile</h1>
        <nav>
            <a href="profile.html">Profile</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="profile-card">
            <div class="avatar"></div>
            <div>
                <h2>About Me</h2>
                <p>Welcome to my profile page. Here you can find details about my work and projects.</p>
            </div>
        </section>

        <section class="contact-form">
            <h3>Contact Me</h3>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="3" placeholder="Your Message"></textarea>
            <button type="button">Send</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 All Rights Reserved.</p>
    </footer>

</body>
</html>
